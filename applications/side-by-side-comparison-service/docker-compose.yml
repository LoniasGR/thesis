services:
  fastapi:
    image: side-by-side-comparison
    build: .
    ports:
      - 8104:80
    environment:
      - UID=${USID}
      - GID=${GID}
      - DB_URL=sqlite:///./production.db
      - MOCK_DIALOGUES_URL=http://mock-dialogues-service
      - SMART_SUGGEST_MICROSERVICE_URL=http://smart-suggest-microservice
    container_name: side-by-side-comparison
    hostname: side-by-side-comparison
    volumes:
      - ./production.db:/code/app/production.db
    restart: always
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set it in .env - see the header of this file}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set it in .env - see the header of this file}
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
networks:
  default:
    name: docker_server
    external: true

volumes:
  postgres_data:
